<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diarylab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: a calm working board. Header + tabs, then one view at a time.
   Brand tokens (--brand*) are placeholders: swap them for the school's colours and font. */
:root{
  --bg:#fbf3f6; --surface:#ffffff; --surface2:#f8ecf1; --ink:#4e333d; --muted:#7d5c69; --line:#f0e2e7;
  --brand:#c94576; --brand-ink:#ffffff; --brand-soft:#fae7ee;
  --accent:#c94576; --accent-ink:#ffffff; --accent-soft:#fae7ee;
  --ok:#17703d; --ok-bg:#e0f2e7; --warn:#8f5300; --warn-bg:#fcebc9; --bad:#a82020; --bad-bg:#fadcdc; --ahead:#8e3b73; --ahead-bg:#f6e4eb;
  --plan-bg:#fae7ee; --plan-line:#f1c5d5; --chem:#b7622a; --phys:#2f66b3; --bio:#237a69; --ws:#9b4f87; --other:#5f6e80;
  --font-display:'Outfit','Segoe UI',system-ui,sans-serif;
  --font-body:'Outfit','Segoe UI',system-ui,sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#211519; --surface:#2c1d23; --surface2:#3a262e; --ink:#f7e8ed; --muted:#c6a7b2; --line:#4f3640;
    --brand:#e290ae; --brand-ink:#371e27; --brand-soft:#502c39;
    --accent:#efa5c0; --accent-ink:#371e27; --accent-soft:#502c39;
    --ok:#5bd08c; --ok-bg:#12301f; --warn:#f2b655; --warn-bg:#3a2a0c; --bad:#ff8f8f; --bad-bg:#3b1717; --ahead:#efa7c1; --ahead-bg:#3d232d;
    --chem:#e8935b; --phys:#78a8ea; --bio:#5cc6b1; --ws:#d9a0cf; --other:#93a2b5;
    --plan-bg:#502c39; --plan-line:#7f465b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#211519; --surface:#2c1d23; --surface2:#3a262e; --ink:#f7e8ed; --muted:#c6a7b2; --line:#4f3640;
  --brand:#e290ae; --brand-ink:#371e27; --brand-soft:#502c39; --accent:#efa5c0; --accent-ink:#371e27; --accent-soft:#502c39;
  --ok:#5bd08c; --ok-bg:#12301f; --warn:#f2b655; --warn-bg:#3a2a0c; --bad:#ff8f8f; --bad-bg:#3b1717; --ahead:#efa7c1; --ahead-bg:#3d232d;
  --chem:#e8935b; --phys:#78a8ea; --bio:#5cc6b1; --ws:#d9a0cf; --other:#93a2b5;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{background-image:linear-gradient(135deg,#2a1a21 0%,#211519 60%,#221619 100%)}}
:root[data-theme="dark"] body{background-image:linear-gradient(135deg,#2a1a21 0%,#211519 60%,#221619 100%)}
.logo{width:40px;height:40px;flex-shrink:0;align-self:center}
.brand h1 .w-c{color:var(--brand)} .brand h1 .w-f{color:#e290ae}
.brand{align-items:center}
.cell.st-p,.tp.st-p,.lessoncard .tc.st-p{background:var(--plan-bg)!important;border:1px solid var(--plan-line)}
.cell.st-p.today{border-color:var(--brand)}
.st-p .tchip,.st-p .chip{background:var(--surface)}
*{box-sizing:border-box}
body{background:var(--bg);background-image:linear-gradient(135deg,#fbf1f5 0%,#fdf6f3 50%,#faf1f6 100%);background-attachment:fixed;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:20px 0 12px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0}
.sub{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
#sync.saved,#sync.saving{display:none}
.pill.saved i{background:var(--ok)} .pill.saving i{background:var(--warn)} .pill.error i,.pill.local i{background:var(--bad)}
nav.tabs{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 12px;border-bottom:1px solid var(--line);margin-bottom:18px}
nav.tabs .tl2{display:flex;gap:4px;overflow-x:auto;max-width:100%}
header.top .hr{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;margin-left:auto}
.hb{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.hb:hover{background:var(--accent-soft)}
.hb[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.hb .ck{display:none;width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff;font-size:12px;line-height:18px;text-align:center}
.hb.done .ck{display:inline-block}
.setcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.setcard label.fl{flex:1 1 260px;display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}
.setcard input,.sheet label.fl input{min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:inherit;font:inherit;font-weight:400}
nav.tabs .tr{display:flex;gap:8px;margin-left:auto;padding-bottom:6px}
nav.tabs .tr button.acc{border:1px solid var(--accent);border-radius:8px;padding:7px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
nav.tabs .tr button.acc.ghost{background:transparent;color:var(--accent)}
nav.tabs .tr button.acc[aria-selected="true"]{box-shadow:0 0 0 3px var(--accent-soft)}
nav.tabs .tr button.acc:hover{filter:brightness(1.07)}
nav.tabs .tl2 button{background:none;border:0;padding:10px 16px;border-bottom:3px solid transparent;font-weight:700;color:var(--muted);white-space:nowrap}
nav.tabs .tl2 button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.banner{background:var(--brand-soft);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:12px}
.bar h2{font-family:var(--font-display);font-size:20px;margin:0}
.bar .grow{flex:1 1 auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;min-height:34px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:default}
.note{color:var(--muted);font-size:14px;margin:0 0 12px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.ahead{background:var(--ahead-bg);color:var(--ahead)}
.chip.none{background:var(--surface2);color:var(--muted)}
.chip.sm{font-size:12px;padding:1px 8px}
/* week view */
.crow{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.crow>.ch{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:10px}
.crow .cn{font-family:var(--font-display);font-weight:700;font-size:18px}
.crow .now{color:var(--muted);font-size:14px;flex:1 1 220px}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cell{border:1px solid var(--line);border-radius:8px;padding:8px 9px;min-height:96px;display:flex;flex-direction:column;gap:4px;background:var(--surface);min-width:0}
.cell .dh{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:700}
.cell.today{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.cell.today .dh{color:var(--brand)}
.tchip{font-size:11px;border-radius:5px;padding:0 6px;background:var(--surface2);color:var(--muted);letter-spacing:.04em}
.tchip.me{background:var(--brand);color:var(--brand-ink)}
.cell .a{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.sl1{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.st-t .sl1{color:var(--ok)}.st-u .sl1{color:var(--bad)}.st-p .sl1{color:var(--brand)}
.sl2{font-weight:400;font-size:13.5px;overflow-wrap:anywhere}
.sl3{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.cell .b{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.cell .acts{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.cell .acts .btn{padding:3px 9px;min-height:30px;font-size:13px}
.cell.st-t{background:var(--ok-bg);border-color:transparent}
.cell.st-t .a{color:var(--ok)}
.cell.st-t.implicit{background:var(--surface);border-color:var(--line)}
.cell.st-t.implicit .a{color:var(--muted);font-weight:400}
.cell.st-l{background:var(--warn-bg);border-color:transparent}
.cell.st-l .a{color:var(--warn)}
.cell.st-u{border:2px dashed var(--bad)}
.cell.st-u .a{color:var(--bad)}
.cell.st-e,.cell.st-x{background:var(--surface2)}
.cell.off{background:repeating-linear-gradient(135deg,var(--surface2) 0 8px,var(--surface) 8px 16px);color:var(--muted)}
.cell.none{border-style:dashed;background:transparent;min-height:0;opacity:.55}
.sheetbg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--surface);color:var(--ink,inherit);width:100%;max-width:440px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet.wide{max-width:860px}
.spotwrap{position:fixed;inset:0;z-index:50;pointer-events:none}
.spotwrap .dim{position:fixed;background:rgba(15,23,42,.58);pointer-events:auto;left:0;top:0;width:100%;height:100%}
.sheet.pop{position:fixed;pointer-events:auto;width:290px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto;border-radius:12px;padding:10px 12px;gap:3px;box-shadow:0 10px 34px rgba(0,0,0,.35);visibility:hidden;z-index:2}
.sheet.pop.popw{width:360px}
.pop h3{font-size:15px}.pop .sub{font-size:12.5px;margin:0 0 2px}
.pop .xbtn{width:30px;height:30px;font-size:15px}
.sheet.pop .xabs{position:absolute;top:8px;right:8px;z-index:3}
.sheet.pop{position:fixed}
.sheet.pop .top1{margin-right:38px}
.pop .sec{font-size:11px;margin-top:6px}
.sheet.pop .grid2{grid-template-columns:1fr;gap:3px}
.pop .btn .ic{flex:none;min-width:2.2em;white-space:nowrap}
.pop .btn.big{min-height:30px;padding:3px 9px;font-size:13.5px;gap:6px}
.pop .pklist{max-height:38vh;gap:3px}
.pop .btn{min-height:30px}
.pop .btn.c-g1{background:#c6ecd1;color:#14532d;border-color:#9ad4ad}
.pop .btn.c-g2{background:#78d093;color:#0a3a1c;border-color:#5bb878}
.pop .btn.c-g3{background:#2e9b55;color:#fff;border-color:#237a43}
.pop .btn.c-or{background:#f9b563;color:#4a2300;border-color:#e59a40}
.pop .btn.c-or2{background:#d4650a;color:#fff;border-color:#a84e05}
.pop .btn.c-bl{background:#2f6fce;color:#fff;border-color:#2559a8}
.pop .btn.c-note{background:#fde27a;color:#5a4200;border-color:#e6c445}
.pop .btn.c-rd{background:#f8d4d4;color:#8a1c1c;border-color:#eaaaaa}
.pop .btn.c-rd2{background:#a31d1d;color:#fff;border-color:#7d1414}
.pop .btn[class*=" c-"]:hover{filter:brightness(.95)}
.sheet{max-width:520px}
.shh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.xbtn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:inherit;font-size:18px;line-height:1;cursor:pointer}
.sheet .sec{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.sheet .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:420px){.sheet .grid2{grid-template-columns:1fr}}
.sheet .btn.big{justify-content:flex-start;text-align:left;display:flex;align-items:center;gap:8px}
.btn .ic{display:inline-block;min-width:1.4em;text-align:center;font-weight:700}
.pklist{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto;position:relative}
.pk.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.pk small{color:var(--muted)}
.nt{color:var(--muted);font-size:12px;font-style:italic}
.sheet label.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.sheet select{min-height:40px;font-size:15px}
.cell[draggable=true],.tp[draggable=true]{cursor:grab;-webkit-user-drag:element;user-select:none}
.cell[draggable=true]::before,.tp[draggable=true]::before{content:'\22EE\22EE';color:var(--muted,#8a94a3);font-size:12px;letter-spacing:-3px;margin-right:4px;pointer-events:none}
.cell[draggable=true]::before{position:absolute;top:4px;right:6px;margin:0}
.cell{position:relative}
.dragging{opacity:.45}
.dragover{outline:2px dashed var(--brand);outline-offset:1px}
.tp .acts{margin-left:auto;display:flex;gap:6px}
.tp .acts .btn{padding:2px 10px;min-height:28px;font-size:13px}
.evrow{display:flex;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);color:var(--muted)}
.uchips{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
h2.uh{font-size:18px;margin:18px 0 8px}
.sheet label.fl{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}
.sheet label.fl input,.sheet label.fl textarea{font-weight:400}
.sheet .err{color:var(--bad);font-weight:700;margin:0}
.sheet table.rv{border-collapse:collapse;width:100%;font-size:14px}
.sheet table.rv th{text-align:left;font-size:12px;color:var(--muted);padding:2px 4px}
.sheet table.rv td{padding:3px 4px;vertical-align:middle}
.sheet table.rv input.dd{width:58px;text-transform:uppercase}
.sheet table.rv input.nm{width:96px}
.sheet .row2{display:flex;gap:8px;flex-wrap:wrap}
.sheet h3{margin:0;font-size:18px}.sheet .sub{margin:0 0 6px;color:var(--muted);font-size:14px}
.btn.big{min-height:44px;font-size:15px;text-align:left;padding:8px 14px;opacity:1}
@media(max-width:699px){.sheetbg.mid{align-items:center;padding:12px}.sheetbg.mid .sheet{border-radius:14px;max-height:calc(100vh - 24px)}}
@media(min-width:700px){.sheetbg{align-items:center}.sheet{border-radius:14px}}
.menu{display:flex;flex-direction:column;gap:4px}
.menu .btn{text-align:left;font-size:13px;padding:4px 9px;min-height:30px}
@media (max-width:720px){.cell.none{display:none}}
/* term plan + lessons */
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill-b{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:700}
.pill-b small{font-weight:400;color:var(--muted);margin-left:4px}
.pill-b.sm{padding:3px 12px;font-weight:400;font-size:14px}
.pill-b.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.pill-b.on small{color:var(--brand-ink)}
.wkblk{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px}
.wkh{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-bottom:6px}
.tpl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.tp{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--surface2)}
.tp .td{width:60px;font-weight:700;font-size:14px}
.tp .tt2{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.tp.st-t{background:var(--ok-bg)} .tp.st-t.implicit{background:var(--surface2)}
.tp.st-l{background:var(--warn-bg)} .tp.st-u{outline:2px dashed var(--bad)}
.tp.st-p{background:var(--surface);border:1px solid var(--line)}
.tp.off{opacity:.7}
.ledit textarea,details.bulk textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;line-height:1.5}
.ledit{padding:0 0 12px 22px}
.ledit .acts,details.bulk .acts{display:flex;gap:8px;margin-top:8px}
details.bulk{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px}
code{background:var(--surface2);padding:1px 6px;border-radius:4px}
/* today view */
ol.tl{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:3px}
.tl-i{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;align-items:start}
.tl-i .tm{padding-top:5px;font-variant-numeric:tabular-nums;line-height:1.1}
.tl-i .tm b{display:block;font-size:14px}
.tl-i .tm span{font-size:11px;color:var(--muted)}
.tl-i.minor .tc{padding:3px 10px;border-radius:8px;background:var(--surface2);color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tl-i.minor .lbl{font-weight:700}
.tl-i.minor.k-break .tc,.tl-i.minor.k-lunch .tc{background:transparent;border:1px dashed var(--line)}
.tl-i .tc.st-p,.tl-i .tc.st-u,.tl-i .tc.st-t,.tl-i .tc.st-l,.tl-i .tc.st-e,.tl-i .tc.st-x,.lessoncard .tc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.tl-i.lessoncard .tc{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;row-gap:1px;align-items:center;padding:6px 10px!important}
.lessoncard .top{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;grid-column:1}
.lessoncard .ab{grid-column:1;line-height:1.25}
.lessoncard .ab .sl1,.lessoncard .ab .sl2,.lessoncard .ab .sl3{display:block}
.lessoncard .cn{font-family:var(--font-display);font-weight:700;font-size:16px;margin-right:2px}
.lessoncard .a{font-weight:700;font-size:14.5px}
.lessoncard .b{color:var(--muted)}
.lessoncard .acts{margin:0;display:flex;gap:6px;flex-wrap:nowrap;grid-column:2;grid-row:1 / span 2}
.lessoncard .acts .btn{padding:3px 12px;min-height:30px;font-size:13.5px}
.lessoncard .tc.st-t{background:var(--ok-bg);border-color:transparent}
.lessoncard .tc.st-t .a{color:var(--ok)}
.lessoncard .tc.st-t.implicit{background:var(--surface);border-color:var(--line)}
.lessoncard .tc.st-l{background:var(--warn-bg);border-color:transparent}
.lessoncard .tc.st-l .a{color:var(--warn)}
.lessoncard .tc.st-u{border:2px dashed var(--bad)}
.lessoncard .tc.st-u .a{color:var(--bad)}
.lessoncard .tc.st-e,.lessoncard .tc.st-x{background:var(--surface2)}
.tl-i{position:relative}
.stk{position:sticky;top:0;z-index:30;background:var(--bg);padding:8px 0 6px;margin-bottom:8px;box-shadow:0 8px 8px -8px rgba(15,23,42,.28)}
.stk .pills{margin-bottom:6px}
.acts{align-items:center!important}
.acts .btn{align-self:center!important;margin:0!important;vertical-align:middle}
.acts .btn.note{position:static;transform:none}
.cell .acts .btn,.tp .acts .btn,.lessoncard .acts .btn{height:30px;min-height:30px;padding-top:0;padding-bottom:0}

  var out={}, cur=null, stray=0, unknown=[];
  String(text).split(/\r?\n/).forEach(function(line){
    var s=line.trim(); if(!s) return;
    var m=s.match(/^#\s*(.+)$/);
    if(m){ cur=m[1].trim(); if(!ids[cur]){ unknown.push(cur); cur=null; } else out[cur]=[]; return; }
    if(cur) out[cur].push(s.replace(/^\d+[.)]\s+/,'')); else stray++;
  });
  return {units:out,unknown:unknown,stray:stray};
}

/* ---------- practicals: lessons that need equipment booking ---------- */
var PRAC={items:{},dd:4,tm:'15:00',wb:1}, PRACRE=/\b(practicals?|pract|prac|exp|expt|experiments?)\b/i;
function pkeyOf(cid,u,line){ return (cid+'_'+u+'_'+line).replace(/[^A-Za-z0-9]+/g,'_').slice(0,120); }
function minusSchoolDays(d,n){
  var left=n, guard=0;
  while(left>0 && guard++<120){ d=add(d,-1); var g=parse(d).getDay(); if(g===0||g===6) continue; if(weekOf(d)<0 && d>=D.cal[0].mon && d<=add(D.cal[NW-1].mon,6)) continue; if(D.off[d]&&!D.off[d].yrs) continue; left--; }
  return d;
}
function pracBy(date){ var g=(parse(date).getDay()+6)%7, mon=add(date,-g); return add(mon,(PRAC.dd-1)-7*(PRAC.wb||1)); }
function pracLate(by){ if(!by) return false; if(by<TODAY) return true; if(by>TODAY) return false; var n=new Date(); return (PRAC.tm||'23:59')<(pad(n.getHours())+':'+pad(n.getMinutes())); }
function pracList(){
  var out=[];
  D.classes.forEach(function(c){
    var m=M[c.id]; if(!m) return;
    m.slots.forEach(function(sl){
      if(!sl.mine || sl.date<TODAY) return;
      if(sl.s==='l'||sl.s==='x') return;
      var tx=slotText(m,sl), hits=(tx.list||[]).filter(function(x){return PRACRE.test(x)});
      if(!hits.length) return;
      var key=pkeyOf(c.id,tx.u,hits[0]), it=PRAC.items[key]||{};
      var by=pracBy(sl.date);
      out.push({key:key,cid:c.id,cname:c.name,date:sl.date,unit:tx.u,title:hits.join(' + '),booked:!!it.b,by:by,note:it.note||'',wi:sl.wi});
    });
  });
  out.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
  return out;
}
function pracStats(){
  var l=pracList(), open=l.filter(function(x){return !x.booked}), late=open.filter(function(x){return pracLate(x.by)}).length,
      soon=open.filter(function(x){return x.by&&!pracLate(x.by)&&x.by<=add(TODAY,7)}).length;
  return {list:l,open:open.length,late:late,soon:soon,total:l.length,state:!l.length?'none':(!open.length?'done':(late?'late':(soon?'soon':'todo')))};
}
function paintPrac(st){
  var b=document.getElementById('t-prac'); if(!b) return;

  } else { box(d[0],0,0,vw,vh); box(d[1],0,0,0,0); box(d[2],0,0,0,0); box(d[3],0,0,0,0); }
  pop.style.maxHeight=(vh-16)+'px';

  if(true){ L=(vw-W)/2; T=(vh-H)/2; }
  else if(r.right+12+W<=vw-8){ L=r.right+12; T=r.top; }
  else if(r.left-12-W>=8){ L=r.left-12-W; T=r.top; }

    var below=vh-8-(r.bottom+8), above=r.top-8-8;

    });
    build(); render();
  }, function(){ setSync('error',"Couldn't load saved progress"); });
  db.collection('config').onSnapshot(function(snap){
    if(pending>0) return;
    var su=snap.docs.filter(function(d){return d.id==='setup'&&d.exists})[0];
    if(su){ var sv=JSON.parse(JSON.stringify(su.data()||{})); ['profile','school','subject','timetable'].forEach(function(k){ if(sv[k]) SETUP[k]=Object.assign({},SETUP[k],sv[k]); }); paintHdr(); render(); }
    var pr=snap.docs.filter(function(d){return d.id==='practicals'&&d.exists})[0];
    if(pr){ var pv=JSON.parse(JSON.stringify(pr.data()||{})); PRAC.items=pv.items||{}; if(pv.dd!=null) PRAC.dd=pv.dd; if(pv.tm!=null) PRAC.tm=pv.tm; if(pv.wb!=null) PRAC.wb=pv.wb||1; render(); }
    var lt=snap.docs.filter(function(d){return d.id==='ltp'&&d.exists})[0];
    if(lt){ var lp=JSON.parse(JSON.stringify((lt.data()||{}).paths||{})); LTPCUST=lp; Object.keys(lp).forEach(function(k){ D.paths[k]=lp[k]; }); if(!ltpDirty) ltpDraft={}; build(); }
    var main=snap.docs.filter(function(d){return d.id==='main'&&d.exists})[0];
    if(main){ var v=JSON.parse(JSON.stringify(main.data()||{})); if(v.classes&&v.classes.length&&v.tt){ exists.cfg=true; applyConfig(v,true); render(); } }
    else if(CUSTOM){ applyConfig(DEFCFG,false); render(); }
    if(!firstRunDone){ firstRunDone=true; if(!D.classes.length && !main){ ttOpenFirst(); } }
  }, function(){});
  db.collection('titles').onSnapshot(function(snap){
    if(pending>0) return;
    snap.docs.forEach(function(d){ if(d.exists){ TI[d.id]=JSON.parse(JSON.stringify((d.data()||{}).units||{})); exists['t:'+d.id]=true; } });
    build(); render();
  }, function(){});
})();
})();
</script>

</body>
</html>
